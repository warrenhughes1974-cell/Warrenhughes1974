[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "citizens-product-rate-conversion"
version = "0.4.0-stage4b"
description = "Citizens Product and Rate Conversion — runtime foundation (Stage 4B)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "qla-enterprise-conversion-engine==0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["conversion/orchestration"]
filterwarnings = [
    "ignore:legacy_cfic_paths.*:DeprecationWarning",
]
